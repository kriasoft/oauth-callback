name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the running checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Bun on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run test

  # The built package on each runtime's exact minimum supported version, with the documented
  # permissions (Deno's env access is for the smoke test's own tmpdir()).
  runtimes:
    name: Smoke (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, deno, bun]

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        if: matrix.runtime == 'node'
        with:
          node-version: "22.0.0"
      - uses: denoland/setup-deno@v2
        if: matrix.runtime == 'deno'
        with:
          deno-version: v2.0.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: node test/runtime-smoke.mjs
        if: matrix.runtime == 'node'
      - run: deno run --allow-net --allow-read --allow-write --allow-env=TMPDIR,TMP,TEMP test/runtime-smoke.mjs
        if: matrix.runtime == 'deno'
      - run: npx -y bun@1.2.0 test/runtime-smoke.mjs
        if: matrix.runtime == 'bun'

  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run build
      # Also fails when a file referenced by package.json exports is missing.
      - run: bun run lint:package
      - run: bun run docs:build

  validate-examples:
    name: Validate Examples
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      # The other examples need accounts; typecheck (tsconfig includes examples/) covers them.
      - run: bun run examples/demo.ts --no-browser
        timeout-minutes: 1
