name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.2.3)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    # Expressions go through env, never inline in scripts, to prevent injection.
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease || false }}

    steps:
      # This job can publish to npm, so actions are pinned to commit SHAs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fully qualified so a same-named branch can't be published.
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Verify version match
        run: |
          PACKAGE_VERSION="v$(node -p 'require("./package.json").version')"
          if [ "$PACKAGE_VERSION" != "$TAG" ]; then
            echo "Error: Package version ($PACKAGE_VERSION) doesn't match tag ($TAG)"
            exit 1
          fi
          echo "✅ Version verified: $PACKAGE_VERSION"

      - run: bun install --frozen-lockfile
      - run: bun run build
      # CI doesn't run on tags, so the released commit is tested here.
      - run: bun test

      - name: Verify dist output
        run: |
          if [ ! -f "dist/index.js" ]; then
            echo "Error: dist/index.js not found"
            exit 1
          fi
          if [ ! -f "dist/index.d.ts" ]; then
            echo "Error: dist/index.d.ts not found"
            exit 1
          fi
          echo "✅ Build output verified"

      # Prereleases (GitHub flag or SemVer suffix) go to "next". Stable releases
      # omit --tag so npm refuses to move "latest" to an older version.
      - name: Publish
        run: |
          ARGS=(--access public --provenance)
          # "${TAG%%+*}" drops build metadata, which may itself contain "-".
          if [ "$PRERELEASE" = "true" ] || [[ "${TAG%%+*}" == *-* ]]; then
            ARGS+=(--tag next)
          fi
          npm publish "${ARGS[@]}"
